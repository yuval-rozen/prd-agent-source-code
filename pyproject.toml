[project]
name = "prd-agent"
version = "0.1.0"
description = "CLI agent that turns a PRD into a validated GitHub issue tree (Epic -> Stories -> Tasks)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.0",
    "langgraph>=1.2.20",
    "pydantic>=2",
    "pymupdf4llm>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
    "typer>=0.29.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
